name: Deploy panel to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - src/AssetSync.Web/**
      - .github/workflows/deploy-panel.yml
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/AssetSync.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/AssetSync.Web/package-lock.json
      - run: npm ci
      - run: npm test
      # The API address is public (it is in the README), so it lives here
      # rather than in a secret. Its CORS already allows this panel's domain.
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://assetsync-api-andres-g5etgpdsc2hfccd6.westus3-01.azurewebsites.net
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/AssetSync.Web/dist
          skip_app_build: true
          skip_api_build: true
