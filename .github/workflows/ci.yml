name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      - name: Integration tests on PostgreSQL
        run: dotnet test tests/AssetSync.IntegrationTests --no-build --configuration Release
        env:
          ASSETSYNC_TEST_DATABASE: PostgreSql
      - name: Validate infrastructure (Bicep)
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Build Docker image
        run: docker build -t assetsync-api .
